x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bhgroup_pms}"
      POSTGRES_USER: "${POSTGRES_USER:-bhgroup}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - database
    mem_limit: 1g
    shm_size: 128m
    logging: *default-logging

  backend:
    image: "bhgroup/backend:${APP_IMAGE_TAG:-production}"
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BACKEND_PORT: "8080"
      DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bhgroup_pms}"
      DB_USERNAME: "${POSTGRES_USER:-bhgroup}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env.production}"
      JWT_ACCESS_TOKEN_EXPIRATION_MS: "${JWT_ACCESS_TOKEN_EXPIRATION_MS:-900000}"
      JWT_REFRESH_TOKEN_EXPIRATION_MS: "${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}"
      APP_BASE_URL: "${APP_BASE_URL:-https://bhstays.ro}"
      APP_API_BASE_URL: "${APP_API_BASE_URL:-https://bhstays.ro/api/v1}"
      APP_NAME: "${APP_NAME:-BH Group PMS}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://bhstays.ro,https://www.bhstays.ro}"
      REFRESH_COOKIE_SECURE: "${REFRESH_COOKIE_SECURE:-true}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in .env.production}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in .env.production}"
      UPLOAD_DIR: /data/uploads
      UPLOAD_PUBLIC_BASE_URL: "${UPLOAD_PUBLIC_BASE_URL:-https://bhstays.ro/uploads}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-no-reply@bhstays.ro}"
      NEXT_PUBLIC_COMPANY_EMAIL: "${NEXT_PUBLIC_COMPANY_EMAIL:-}"
      NEXT_PUBLIC_COMPANY_PHONE: "${NEXT_PUBLIC_COMPANY_PHONE:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
      ANTHROPIC_MAX_TOKENS: "${ANTHROPIC_MAX_TOKENS:-400}"
      ANTHROPIC_MAX_HISTORY_MESSAGES: "${ANTHROPIC_MAX_HISTORY_MESSAGES:-16}"
      ANTHROPIC_TIMEOUT_MS: "${ANTHROPIC_TIMEOUT_MS:-15000}"
      ASSISTANT_CHAT_RETENTION_DAYS: "${ASSISTANT_CHAT_RETENTION_DAYS:-90}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - backend_proxy
      - database
    mem_limit: 1536m
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    image: "bhgroup/frontend:${APP_IMAGE_TAG:-production}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-https://bhstays.ro/api/v1}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://bhstays.ro}"
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}"
        NEXT_PUBLIC_COMPANY_EMAIL: "${NEXT_PUBLIC_COMPANY_EMAIL:-}"
        NEXT_PUBLIC_COMPANY_PHONE: "${NEXT_PUBLIC_COMPANY_PHONE:-}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-https://bhstays.ro/api/v1}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://bhstays.ro}"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}"
      NEXT_PUBLIC_COMPANY_EMAIL: "${NEXT_PUBLIC_COMPANY_EMAIL:-}"
      NEXT_PUBLIC_COMPANY_PHONE: "${NEXT_PUBLIC_COMPANY_PHONE:-}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:process.env.HOSTNAME,port:3000,path:'/'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - frontend_proxy
    mem_limit: 768m
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend_proxy
      - frontend_proxy
    mem_limit: 256m
    logging: *default-logging

networks:
  frontend_proxy:
    driver: bridge
  backend_proxy:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
